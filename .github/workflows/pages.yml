name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode icons
        run: |
          python3 - <<'PY'
          import base64, pathlib
          for name in ("icon-180.png", "icon-512.png"):
              src = pathlib.Path(name + ".b64")
              pathlib.Path(name).write_bytes(base64.b64decode(src.read_text().strip()))
              print("wrote", name, pathlib.Path(name).stat().st_size)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
