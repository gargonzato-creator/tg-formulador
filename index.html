<style>
:root {
  --bg: #e6e0d4;
  --paper: #fbf8f2;
  --ink: #1b1914;
  --muted: #5f584e;
  --line: #ddd4c6;
  --green: #1b3c31;
  --green-2: #2c6a4e;
  --brass: #8d6234;
  --bad: #8e2e2c;
  --mid: #8a5810;
  --ok: #1d6a42;
  --okbg: #e4f3ea;
  --midbg: #f8efd4;
  --badbg: #f8e3e0;
  --infobg: #e7eef0;
  --shadow: 0 10px 30px rgba(40, 32, 18, 0.08);
  --nav: 4.6rem;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { height: 100%; }
body {
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 18px;
  line-height: 1.35;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; }
#app-ui { max-width: 980px; margin: 0 auto; min-height: 100dvh; }
.top {
  display: flex; gap: 12px; align-items: center;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px 12px;
  background: var(--green); color: #f6f1e6;
}
.mark {
  width: 52px; height: 52px; flex: none;
  display: grid; place-items: center;
  border: 1.5px solid #d7b07a;
  font-family: Palatino, "Palatino Linotype", Georgia, serif;
  font-weight: 700; letter-spacing: 0.04em; font-size: 20px;
}
.top strong { display: block; font-family: Palatino, Georgia, serif; font-size: 22px; font-weight: 600; }
.top span { display: block; font-size: 13px; letter-spacing: 0.01em; opacity: 0.86; }
.screen {
  padding: 14px 14px calc(var(--nav) + var(--safe) + 18px);
}
h1, h2, h3 { font-family: Palatino, "Palatino Linotype", Georgia, serif; font-weight: 600; margin: 0 0 8px; }
h1 { font-size: 30px; line-height: 1.1; }
h2 { font-size: 22px; }
.sub { color: var(--muted); margin: 0 0 12px; }
.card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 14px;
  margin: 0 0 12px;
  box-shadow: var(--shadow);
}
.row { display: flex; gap: 10px; align-items: end; }
.grow { flex: 1; }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
label.f span { letter-spacing: 0.02em; }
input[type="text"], input[type="number"], input[type="date"], select, textarea {
  width: 100%;
  min-height: 52px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1.5px solid #cfc5b4;
  background: #fff;
  font-size: 20px;
}
textarea { min-height: 88px; font-size: 17px; }
input:focus, select:focus, textarea:focus { outline: 3px solid #d7b07a; border-color: var(--green); }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg { display: flex; flex-wrap: wrap; background: #efe8dc; border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 12px; }
.seg button {
  flex: 1 1 42%; min-height: 48px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); font-weight: 650;
}
.seg button.on { background: var(--green); color: #f6f1e6; }
.btn, .btn-ghost, .btn-bad {
  min-height: 54px; border-radius: 14px; border: 0; padding: 12px 14px; font-weight: 680;
  width: 100%; margin-top: 8px;
}
.btn { background: var(--green); color: #f6f1e6; }
.btn-ghost { background: transparent; border: 1.5px solid var(--green); color: var(--green); }
.btn-bad { background: var(--badbg); color: var(--bad); }
.btn-small { min-height: 44px; width: auto; padding: 8px 12px; margin: 0; }
.live {
  position: sticky; top: 0; z-index: 3;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  background: #f3ecdf; border: 1px solid var(--line); border-radius: 14px;
  padding: 8px; margin-bottom: 12px;
}
.live b { display: block; font-size: 16px; }
.live span { font-size: 12px; color: var(--muted); }
.ing {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  padding: 10px 0; border-top: 1px solid var(--line);
}
.ing h3 { font-size: 18px; margin: 0; font-family: -apple-system, sans-serif; }
.ing p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
.step { display: flex; align-items: center; gap: 6px; }
.step button {
  width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid #cfc5b4; background: #fff; font-size: 26px;
}
.step input { width: 84px; text-align: center; min-height: 48px; padding: 6px; }
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: #fbf8f2; border-top: 1px solid var(--line);
  padding-bottom: var(--safe);
}
.nav button {
  border: 0; background: transparent; min-height: var(--nav);
  font-size: 12px; color: var(--muted); padding: 8px 2px 10px;
}
.nav button.on { color: var(--green); font-weight: 750; }
.badge {
  display: inline-block; font-size: 12px; letter-spacing: 0.03em;
  border-radius: 999px; padding: 3px 8px; margin-right: 4px; background: #efe6d6; color: #5c4a30;
}
.badge.est { background: #efe6d6; }
.badge.ok { background: var(--okbg); color: var(--ok); }
.badge.mid { background: var(--midbg); color: var(--mid); }
.badge.bad { background: var(--badbg); color: var(--bad); }
.alert { border-radius: 14px; padding: 12px; margin: 0 0 10px; }
.alert b { display: block; margin-bottom: 4px; }
.alert.bad { background: var(--badbg); }
.alert.mid { background: var(--midbg); }
.alert.info { background: var(--infobg); }
.alert.ok { background: var(--okbg); }
table { width: 100%; border-collapse: collapse; font-size: 16px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 13px; color: var(--muted); font-weight: 650; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.kpi { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi div { background: #fff; border-radius: 12px; padding: 10px; border: 1px solid var(--line); }
.kpi b { display: block; font-size: 20px; }
.kpi span { color: var(--muted); font-size: 13px; }
.toast {
  position: fixed; left: 16px; right: 16px; bottom: calc(var(--nav) + var(--safe) + 10px);
  background: var(--ink); color: #fff; border-radius: 12px; padding: 12px 14px; z-index: 6;

.modal {
  position: fixed; inset: 0; background: rgba(28, 25, 20, 0.45); z-index: 8;

.modal .card { width: min(560px, 100%); margin: 0; max-height: 85dvh; overflow: auto; border-bottom-left-radius: 0; border-bottom-right-radius: 0; padding-bottom: calc(16px + var(--safe)); }
.list-btn {
  width: 100%; text-align: left; background: var(--paper); border: 1px solid var(--line);
  border-radius: 16px; padding: 14px; margin: 0 0 10px; box-shadow: var(--shadow);

.list-btn small { display: block; color: var(--muted); margin-top: 4px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 48px; font-size: 17px; color: var(--ink); }
.check input { width: 26px; height: 26px; }
.sheet {
  background: white; color: #1b1914; padding: 18px 16px 28px; border-radius: 8px;

.sheet header.rep { border-bottom: 3px solid #1b3c31; padding-bottom: 8px; margin-bottom: 12px; }
.sheet .brand { font-family: Palatino, Georgia, serif; font-size: 22px; margin: 0; }
.sheet .brand small { display: block; font-family: -apple-system, sans-serif; font-size: 13px; letter-spacing: 0.02em; }
.sheet h2 { font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-top: 16px; }
.sheet table { font-size: 12px; }
.sheet td, .sheet th { padding: 4px; }
.muted { color: var(--muted); }
hr.soft { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
@media (max-width: 420px) {
  .grid-3 { grid-template-columns: 1fr 1fr; }
  .live { grid-template-columns: 1fr 1fr; }
  .top strong { font-size: 18px; }

@media print {
  body { background: white; }
  #app-ui .top, #app-ui .nav, #app-ui .no-print, .toast, .modal, .btn, .btn-ghost, .btn-bad { display: none !important; }
  #app-ui, .screen { max-width: none; padding: 0; }
  .sheet { box-shadow: none; border-radius: 0; }
  .sheet tr, .sheet h2 { break-inside: avoid; page-break-inside: avoid; }
  .sheet table { width: 100%; }
  .card { box-shadow: none; }
}

<script>
/* Simplex de dos fases, sin dependencias. Minimiza c·x, x >= 0. */
(function (root) {
  "use strict";

  var EPS = 1e-9;

  function solveLP(c, constraints) {
    var n0 = c.length;
    var cons = [];
    for (var i = 0; i < constraints.length; i++) {
      var ct = constraints[i];
      var a = ct.a.slice();
      var op = ct.op;
      var b = ct.b;
      if (b < -EPS) {
        for (var j = 0; j < a.length; j++) a[j] = -a[j];
        b = -b;
        if (op === "<=") op = ">=";
        else if (op === ">=") op = "<=";
      } else if (b < 0) {
        b = 0;
      }
      cons.push({ a: a, op: op, b: b });
    }

    var nSlack = 0;
    var nSurp = 0;
    var nArt = 0;
    for (var k = 0; k < cons.length; k++) {
      if (cons[k].op === "<=") nSlack++;
      else if (cons[k].op === ">=") {
        nSurp++;
        nArt++;
      } else nArt++;
    }

    var slack0 = n0;
    var surp0 = n0 + nSlack;
    var art0 = n0 + nSlack + nSurp;
    var N = art0 + nArt;
    var m = cons.length;
    var T = [];
    var basis = [];
    var s = 0;
    var u = 0;
    var art = 0;

    for (var r = 0; r < m; r++) {
      var row = [];
      for (var cix = 0; cix <= N; cix++) row.push(0);
      var ct2 = cons[r];
      for (var j2 = 0; j2 < n0; j2++) row[j2] = ct2.a[j2] || 0;
      row[N] = ct2.b;
      if (ct2.op === "<=") {
        row[slack0 + s] = 1;
        basis.push(slack0 + s);
        s++;
      } else if (ct2.op === ">=") {
        row[surp0 + u] = -1;
        row[art0 + art] = 1;
        basis.push(art0 + art);
        u++;
        art++;
      } else {
        row[art0 + art] = 1;
        basis.push(art0 + art);
        art++;
      }
      T.push(row);
    }

    function pivot(row, col) {
      var piv = T[row][col];
      for (var j3 = 0; j3 <= N; j3++) T[row][j3] /= piv;
      for (var i3 = 0; i3 < m; i3++) {
        if (i3 === row) continue;
        var f = T[i3][col];
        if (Math.abs(f) < 1e-15) continue;
        for (var j4 = 0; j4 <= N; j4++) T[i3][j4] -= f * T[row][j4];
      }
      basis[row] = col;
    }

    function reduced(cost, j) {
      var rc = cost[j] || 0;
      for (var i4 = 0; i4 < m; i4++) rc -= (cost[basis[i4]] || 0) * T[i4][j];
      return rc;
    }

    function phase(cost, artLimit) {
      var limit = artLimit == null ? N : artLimit;
      for (var it = 0; it < 5000; it++) {
        var enter = -1;
        for (var j5 = 0; j5 < limit; j5++) {
          if (reduced(cost, j5) < -EPS) {
            enter = j5;
            break;
          }
        }
        if (enter < 0) {
          var val = 0;
          for (var i5 = 0; i5 < m; i5++) val += (cost[basis[i5]] || 0) * T[i5][N];
          return { ok: true, value: val };
        }
        var leave = -1;
        var bestRatio = Infinity;
        for (var i6 = 0; i6 < m; i6++) {
          if (T[i6][enter] > EPS) {
            var ratio = T[i6][N] / T[i6][enter];
            if (
              ratio < bestRatio - 1e-12 ||
              (Math.abs(ratio - bestRatio) <= 1e-12 && (leave < 0 || basis[i6] < basis[leave]))
            ) {
              bestRatio = ratio;
              leave = i6;
            }
          }
        }
        if (leave < 0) return { ok: false, status: "unbounded" };
        pivot(leave, enter);
      }
      return { ok: false, status: "iter" };
    }

    if (nArt > 0) {
      var c1 = [];
      for (var z = 0; z < N; z++) c1.push(0);
      for (var a = art0; a < N; a++) c1[a] = 1;
      var p1 = phase(c1, N);
      if (!p1.ok) return { ok: false, status: p1.status || "error" };
      if (p1.value > 1e-6) return { ok: false, status: "infeasible" };
      for (var i7 = 0; i7 < m; i7++) {
        if (basis[i7] >= art0) {
          var col = -1;
          for (var j6 = 0; j6 < art0; j6++) {
            if (Math.abs(T[i7][j6]) > 1e-8) {
              col = j6;
              break;
            }
          }
          if (col >= 0) pivot(i7, col);
        }
      }
    }

    var c2 = [];
    for (var z2 = 0; z2 < N; z2++) c2.push(0);
    for (var j7 = 0; j7 < n0; j7++) c2[j7] = c[j7];
    var p2 = phase(c2, art0);
    if (!p2.ok) return { ok: false, status: p2.status || "error" };

    var x = [];
    for (var j8 = 0; j8 < n0; j8++) x.push(0);
    for (var i8 = 0; i8 < m; i8++) {
      if (basis[i8] >= 0 && basis[i8] < n0) x[basis[i8]] = Math.max(0, T[i8][N]);
    }
    for (var j9 = 0; j9 < n0; j9++) if (x[j9] < 1e-8) x[j9] = 0;
    var value = 0;
    for (var j10 = 0; j10 < n0; j10++) value += c[j10] * x[j10];
    return { ok: true, x: x, value: value, status: "optimal" };
  }

  root.TGSimplex = { solveLP: solveLP };
})(typeof globalThis !== "undefined" ? globalThis : this);

    html += numField("tratos", "Tratos por día", f.tratos);
    html += numField("cargaKg", "Carga del mixer, kg", f.cargaKg);
    html += "</div>";
    html += numField("aguaL", "Agua añadida, litros por cabeza", f.aguaL);
    html += '<label class="f"><span>Notas internas</span><textarea data-fid="notasInternas" data-bind="notasInternas">' + esc(f.notasInternas || "") + "</textarea></label>";
    html += '<p class="sub">Estas notas quedan en el aparato. No salen en el informe.</p>';
    html += '<label class="f"><span>Observaciones para el cliente</span><textarea data-fid="observaciones" data-bind="observaciones">' + esc(f.observaciones || "") + "</textarea></label>";
    html += '<p class="sub">Si escribís algo acá, sale en el informe. Si lo dejás vacío, no se imprime.</p>';
    html += "</div>";
    html += '<button class="btn" type="button" data-go="resultado">Ver resultado</button>';
    html += '<button class="btn-ghost" type="button" data-act="duplicar">Duplicar fórmula</button>';
    html += '<button class="btn-bad" type="button" data-act="borrar-formula">Quitar esta fórmula</button>';
    return html;
  }

  function liveCell(k, v) {
    return "<div><span>" + esc(k) + "</span><b>" + esc(v) + "</b></div>";
  }
  function segBtn(act, val, label, on) {
    return '<button type="button" data-act="' + act + '" data-val="' + esc(val) + '" class="' + (on ? "on" : "") + '">' + esc(label) + "</button>";
  }
  function campoNum(n) {
    if (n == null || n === "") return "";
    var x = Number(n);
    if (!isFinite(x)) return "";
    return esc(String(Math.round(x * 10000) / 10000).replace(".", ","));
  }
  function numField(bind, label, value) {
    return '<label class="f"><span>' + esc(label) + '</span><input inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" data-fid="' + bind + '" data-bind="' + bind + '" value="' + campoNum(value) + '"></label>';
  }
  function selectCategorias(f) {
    var html = '<label class="f"><span>Categoría</span><select data-bind="categoriaId">';
    [["bovino", "Bovinos"], ["ovino", "Ovinos"]].forEach(function (g) {
      var lista = categoriasVisibles().filter(function (c) { return c.especie === g[0]; });
      if (!lista.length) return;
      html += '<optgroup label="' + esc(g[1]) + '">';
      lista.forEach(function (c) {
        html += '<option value="' + esc(c.id) + '"' + (c.id === f.categoriaId ? " selected" : "") + ">" + esc(c.nombre) + "</option>";
      });
      html += "</optgroup>";
    });
    return html + "</select></label>";
  }
  function selectField(bind, label, opts, value) {
    return (
      '<label class="f"><span>' + esc(label) + '</span><select data-bind="' + bind + '">' +
      opts.map(function (o) {
        return '<option value="' + esc(o.id) + '"' + (o.id === value ? " selected" : "") + ">" + esc(o.nombre) + "</option>";
      }).join("") +
      "</select></label>"
    );
  }

  function bloqueManual(f) {
    var cat = catDe(f);
    var usados = [];
    var libres = [];
    S.db.ingredientes.forEach(function (ing) {
      if (!ing.activo || ing.id === "agua") return;
      var it = (f.items || []).filter(function (x) { return x.ingredientId === ing.id; })[0];
      var enFormula = it && it.usar && Number(it.pct) > 0;
      if (enFormula) usados.push(ing);
      else if (root.TGRation.insumoOfrecido(ing, cat)) libres.push(ing);
    });
    var especieTxt = cat && cat.especie === "ovino" ? "ovinos" : "bovinos";
    var html = '<div class="card"><h2>Porcentaje sobre materia seca</h2><p class="sub">Como en la planilla: cada número es % de la MS. La suma tiene que dar 100. Para sumar, solo ves insumos de ' + especieTxt + '.</p>';
    if (!usados.length) html += '<p>Todavía no hay insumos en la fórmula.</p>';
    usados.forEach(function (ing) {
      var it = itemDe(f, ing.id);
      var precio = root.TGRation.precioKg(ing, S.db.settings.tipoCambio);
      html += '<div class="ing"><div><h3>' + esc(ing.nombre) + "</h3><p>MS " + fmt(ing.ms, 0) + " % · " + gs(precio) + "/kg";
      if (ing.precioNota) html += " · " + esc(ing.precioNota);
      html += "</p></div>";
      html += '<div class="step"><button type="button" data-act="step" data-id="' + ing.id + '" data-dir="-1" aria-label="Bajar">−</button>';
      html += '<input inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" data-fid="pct-' + ing.id + '" data-bind="pct" data-id="' + ing.id + '" value="' + campoNum(it.pct) + '">';
      html += '<button type="button" data-act="step" data-id="' + ing.id + '" data-dir="1" aria-label="Subir">+</button></div></div>';
    });
    html += '<button class="btn" type="button" data-act="cerrar100">Cerrar los % en 100</button>';
    if (libres.length) {
      html += '<label class="f" style="margin-top:12px"><span>Sumar un insumo</span><select data-act="agregar" id="agregar-insumo"><option value="">Elegir…</option>';
      libres.forEach(function (ing) {
        html += '<option value="' + esc(ing.id) + '">' + esc(ing.nombre) + "</option>";
      });
      html += "</select></label>";
    }
    html += "</div>";
    return html;
  }

  function bloqueMinimo(f) {
    var cat = catDe(f);
    var especieTxt = cat && cat.especie === "ovino" ? "ovinos" : "bovinos";
    var html = '<div class="card"><h2>Mínimos y máximos</h2><p class="sub">El programa busca la mezcla más barata que entre en estos topes y en los de la categoría. Tocá «Sugerir límites» si partís de cero. Solo ves insumos de ' + especieTxt + '.</p>';
    html += '<button class="btn-ghost" type="button" data-act="sugerir">Sugerir límites de esta categoría</button>';
    var grupos = [];
    S.db.ingredientes.forEach(function (ing) {
      if (!visibleEnMinimo(ing, f, cat)) return;
      if (grupos.indexOf(ing.grupo) < 0) grupos.push(ing.grupo);
    });
    grupos.forEach(function (g) {
      html += "<h3>" + esc(g) + "</h3>";
      S.db.ingredientes.forEach(function (ing) {
        if (ing.grupo !== g || !visibleEnMinimo(ing, f, cat)) return;
        var it = itemDe(f, ing.id);
        html += '<div class="ing"><div><label class="check"><input type="checkbox" data-bind="usar" data-id="' + ing.id + '"' + (it.usar ? " checked" : "") + "><span>" + esc(ing.nombre) + "</span></label>";
        html += "<p>" + gs(root.TGRation.precioKg(ing, S.db.settings.tipoCambio)) + "/kg</p></div>";
        html += '<div class="grid-2" style="min-width:150px"><label class="f"><span>Mín %</span><input inputmode="decimal" autocomplete="off" data-bind="min" data-id="' + ing.id + '" value="' + campoNum(it.min || 0) + '"></label>';
        html += '<label class="f"><span>Máx %</span><input inputmode="decimal" autocomplete="off" data-bind="max" data-id="' + ing.id + '" value="' + campoNum(it.max || 0) + '"></label></div></div>';
      });
    });
    html += limitesNutrientes(f);
    html += '<button class="btn" type="button" data-act="optimizar">Formular a mínimo costo</button>';
    if (S.lpMsg) html += '<div class="alert ' + (S.lpOk ? "ok" : "mid") + '">' + esc(S.lpMsg) + "</div>";
    html += "</div>";
    return html;
  }

  function limitesNutrientes(f) {
    var L = f.limites || {};
    function par(key, label) {
      var o = L[key] || { min: "", max: "" };
      return (
        "<tr><td>" + esc(label) + '</td><td class="num"><input inputmode="decimal" autocomplete="off" data-bind="lim-min" data-nut="' + key + '" value="' + campoNum(o.min) + '"></td><td class="num"><input inputmode="decimal" autocomplete="off" data-bind="lim-max" data-nut="' + key + '" value="' + campoNum(o.max) + '"></td></tr>'
      );
    }
    return (
      "<h3>Topes de la mezcla</h3><p class=\"sub\">Dejá el casillero vacío si no querés tope. Ca:P es la relación mínima.</p><table><thead><tr><th></th><th class=\"num\">Mínimo</th><th class=\"num\">Máximo</th></tr></thead><tbody>" +
      par("pb", "PB %") + par("ndt", "NDT %") + par("fdn", "FDN %") + par("ca", "Ca %") + par("p", "P %") +
      par("almidon", "Almidón %") + par("concentrado", "Concentrado %") + par("caP", "Ca:P") +
      "</tbody></table>"
    );
  }

  function screenResultado(f, res) {
    if (!f) return "<h1>Sin fórmula</h1>";
    var alerts = root.TGRation.alertas(f, res);
    var html = "<h1>Resultado</h1><p class=\"sub\">" + esc(f.nombre) + "</p>";
    if (Math.abs(res.sumPct - 100) <= 0.15 && !alerts.some(function (a) { return a.nivel === "bad"; })) {
      html += '<div class="alert ok"><b>La mezcla cierra.</b> Los porcentajes suman 100 y no hay una alerta roja.</div>';
    }
    alerts.forEach(function (a) {
      html += '<div class="alert ' + a.nivel + '"><b>' + esc(a.titulo) + "</b>" + esc(a.texto) + "</div>";
    });
    html += '<div class="kpi">';
    html += kpi("MS por cabeza", fmt(res.ims, 2) + " kg");
    html += kpi("Tal cual por cabeza", fmt(res.kgMo, 2) + " kg");
    html += kpi("Costo por kg tal cual", gs(res.gsKgMo));
    html += kpi("USD por tonelada tal cual", usd(res.usdTonMo));
    html += kpi("Costo por cabeza y día", gs(res.costoCabeza));
    html += kpi("USD por cabeza y día", usd(res.usdCabeza));
    html += "</div>";
    html += "<h2>Análisis contra el requerimiento</h2>";
    html += tablaNutrientes(f, res);
    if (f.referencia) html += bloqueReferencia(f, res);
    html += "<h2>Composición</h2>";
    html += '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Insumo</th><th class="num">% MS</th><th class="num">% tal cual</th><th class="num">kg MS</th><th class="num">kg tal cual</th></tr></thead><tbody>';
    res.filas.forEach(function (r) {
      html += "<tr><td>" + esc(r.nombre) + "</td><td class=\"num\">" + fmt(r.pctMs, 1) + "</td><td class=\"num\">" + fmt(r.pctMo, 1) + "</td><td class=\"num\">" + fmt(r.kgMs, 2) + "</td><td class=\"num\">" + fmt(r.kgMo, 2) + "</td></tr>";
    });
    if (res.agua > 0) html += '<tr><td>Agua</td><td class="num">—</td><td class="num">—</td><td class="num">0</td><td class="num">' + fmt(res.agua, 2) + "</td></tr>";
    html += "</tbody></table></div>";
    html += "<h2>Mixer y necesidades</h2>";
    html += '<div class="card">';
    if (f.comidas && f.comidas.length) {
      html += "<p>Comidas del día: " + f.comidas.map(function (c) { return "<b>" + esc(c.nombre) + "</b> " + fmt(c.kg, 0) + " kg"; }).join(" · ") + ".</p>";
    }
    html += "<p>Carga de <b>" + fmt(res.cargaKg, 0) + " kg</b> tal cual. Alcanza para unas <b>" + fmt(res.animalesPorCarga, 1) + "</b> cabezas de una comida. Tratos por día: <b>" + res.tratos + "</b>.</p>";
    html += "<p class=\"sub\">Orden de carga: fibra primero, silos después, concentrados y el núcleo al final. Lo cambiás en cada insumo. Los kilos de la carga están redondeados a 100 g y cierran con el total del mixer.</p>";
    html += '<div style="overflow-x:auto"><table><thead><tr><th>Orden</th><th>Insumo</th><th class="num">En la carga</th><th class="num">Día</th><th class="num">Semana</th><th class="num">Mes</th><th class="num">Gs / día</th></tr></thead><tbody>';
    res.cargaFilas.forEach(function (r, i) {
      html += "<tr><td>" + (i + 1) + "</td><td>" + esc(r.nombre) + "</td><td class=\"num\">" + fmt(r.kgCarga, 1) + "</td><td class=\"num\">" + fmt(r.dia, 1) + "</td><td class=\"num\">" + fmt(r.semana, 0) + "</td><td class=\"num\">" + fmt(r.mes, 0) + "</td><td class=\"num\">" + gs(r.costoDia) + "</td></tr>";
    });
    html += '<tr><td></td><td><b>Total</b></td><td class="num"><b>' + fmt(res.cargaKg, 0) + '</b></td><td class="num"><b>' + fmt(res.kgMo * res.cabezas, 1) + "</b></td><td></td><td></td><td class=\"num\"><b>" + gs(res.costoDia) + "</b></td></tr>";
    html += "</tbody></table></div>";
    html += "<p>Semana (7 días): " + gs(res.costoSemana) + ". Mes (30 días): " + gs(res.costoMes) + ". Tipo de cambio: " + fmt(S.db.settings.tipoCambio, 0) + " Gs por USD.</p>";
    html += "</div>";
    html += '<button class="btn" type="button" data-go="informe">Informe para imprimir o PDF</button>';
    return html;
  }
  function kpi(a, b) { return "<div><span>" + esc(a) + "</span><b>" + esc(b) + "</b></div>"; }

  function filaNut(nombre, valor, unidad, min, max, dec) {
    var s = root.TGRation.semaforo(valor, min, max);
    var req = "";
    if (min != null && max != null) req = fmt(min, dec) + " – " + fmt(max, dec);
    else if (min != null) req = "mín. " + fmt(min, dec);
    else if (max != null) req = "máx. " + fmt(max, dec);
    else req = "—";
    return "<tr><td>" + esc(nombre) + "</td><td class=\"num\">" + fmt(valor, dec) + " " + unidad + '</td><td class="num">' + esc(req) + '</td><td><span class="badge ' + s.nivel + '">' + esc(s.texto) + "</span></td></tr>";
  }
  function tablaNutrientes(f, res) {
    var r = res.req;
    var html = '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Nutriente</th><th class="num">Ración</th><th class="num">Requerimiento</th><th>Estado</th></tr></thead><tbody>';
    html += "<tr><td>MS de la mezcla</td><td class=\"num\">" + fmt(res.msRacion, 1) + " %</td><td class=\"num\">—</td><td><span class=\"badge\">Info</span></td></tr>";
    html += filaNut("Proteína bruta", res.nut.pb, "%", r.pb, null, 1);
    html += filaNut("NDT", res.nut.ndt, "%", r.ndt, null, 1);
    html += "<tr><td>EM</td><td class=\"num\">" + fmt(res.em, 2) + " Mcal/kg</td><td class=\"num\">derivada del NDT</td><td><span class=\"badge\">Info</span></td></tr>";
    html += filaNut("FDN", res.nut.fdn, "%", r.fdnMin, null, 1);
    html += "<tr><td>Extracto etéreo</td><td class=\"num\">" + fmt(res.nut.ee, 1) + " %</td><td class=\"num\">—</td><td><span class=\"badge\">Info</span></td></tr>";
    html += filaNut("Calcio", res.nut.ca, "%", r.ca, null, 2);
    html += filaNut("Fósforo", res.nut.p, "%", r.p, null, 2);
    html += filaNut("Ca:P", res.caP, "", r.caPMin, null, 2);
    html += filaNut("Almidón estimado", res.nut.almidon, "%", null, r.almMax, 1);
    html += filaNut("Concentrado", res.conc, "%", null, r.concMax, 0);
    if (res.urea > 0.01) html += "<tr><td>Urea</td><td class=\"num\">" + fmt(res.urea, 2) + " %</td><td class=\"num\">según núcleo</td><td><span class=\"badge mid\">Revisar</span></td></tr>";
    if (res.monensina > 0.1) html += "<tr><td>Monensina</td><td class=\"num\">" + fmt(res.monensina, 0) + " mg/kg</td><td class=\"num\">según núcleo</td><td><span class=\"badge mid\">Revisar</span></td></tr>";
    html += "</tbody></table></div>";
    return html;
  }

  function bloqueReferencia(f, res) {
    var r = f.referencia;
    var rows = [];
    function add(nombre, calc, ref, dec) {
      if (ref == null || ref === "") return;
      rows.push("<tr><td>" + esc(nombre) + "</td><td class=\"num\">" + (typeof calc === "number" ? fmt(calc, dec) : esc(calc)) + "</td><td class=\"num\">" + (typeof ref === "number" ? fmt(ref, dec) : esc(ref)) + "</td></tr>");
    }
    add("PB %", res.nut.pb, r.pb, 2);
    add("NDT %", res.nut.ndt, r.ndt, 2);
    add("FDN %", res.nut.fdn, r.fdn, 2);
    add("EE %", res.nut.ee, r.ee, 2);
    add("Urea %", res.urea, r.urea, 2);
    add("Ca g/kg", res.nut.ca * 10, r.caG, 2);
    add("P g/kg", res.nut.p * 10, r.pG, 2);
    add("Ca:P", res.caP, r.caP, 2);
    add("Monensina mg/kg", res.monensina, r.monensina, 0);
    if (!rows.length) return "";
    return '<h2>Contra la referencia del fabricante</h2><div class="card" style="overflow-x:auto"><p class="sub">' + esc(r.texto || "Valores que declaró el fabricante para la ración terminada.") + "</p><table><thead><tr><th></th><th class=\"num\">Calculado</th><th class=\"num\">Referencia</th></tr></thead><tbody>" + rows.join("") + "</tbody></table>" + (r.ee != null ? "<p class=\"sub\">Si el extracto etéreo no coincide, es porque el EE de tabla del maíz ya cubre solo la garantía. No se forzó el número.</p>" : "") + "</div>";
  }

  function screenFormulas() {
    var html = "<h1>Fórmulas guardadas</h1><p class=\"sub\">Quedan en este aparato y también en el respaldo JSON.</p>";
    html += '<button class="btn" type="button" data-act="nueva">Nueva fórmula</button>';
    var clientes = S.db.clientes.slice();
    clientes.push({ id: "", nombre: "Sin cliente" });
    clientes.forEach(function (c) {
      var lista = S.db.formulas.filter(function (f) { return (f.clienteId || "") === c.id; });
      if (!lista.length && c.id === "") return;
      if (!lista.length) return;
      html += "<h2>" + esc(c.nombre) + "</h2>";
      lista.forEach(function (f) {
        var cat = catDe(f);
        var on = f.id === S.db.activeFormulaId ? " · abierta" : "";
        html += '<button class="list-btn" type="button" data-act="abrir" data-id="' + f.id + '"><b>' + esc(f.nombre) + "</b><small>" + esc(f.fecha) + " · " + esc(cat ? cat.nombre : "") + on + "</small></button>";
      });
    });
    return html;
  }

  function screenInsumos() {
    var html = "<h1>Insumos</h1><p class=\"sub\">Los marcados como estimados salen de tabla, no de un laboratorio. Tocá uno para editarlo.</p>";
    S.db.notas.forEach(function (n) {
      html += '<div class="alert info"><b>' + esc(n.titulo) + "</b>" + esc(n.texto) + "</div>";
    });
    var grupo = "";
    S.db.ingredientes.forEach(function (ing) {
      if (ing.grupo !== grupo) {
        grupo = ing.grupo;
        html += "<h2>" + esc(grupo) + "</h2>";
      }
      var tags = "";
      if (ing.sinRotulo) tags += '<span class="badge mid">Sin rótulo</span>';
      else if (ing.origen) tags += '<span class="badge">' + esc(ing.origen) + "</span>";
      else if (ing.estimado) tags += '<span class="badge est">Estimado de tabla</span>';
      if (ing.precioNota) tags += '<span class="badge">' + esc(ing.precioNota) + "</span>";
      var precio = root.TGRation.precioKg(ing, S.db.settings.tipoCambio);
      var extra = "";
      if (ing.bolsaKg && ing.bolsaGs) extra = " · bolsa " + fmt(ing.bolsaKg, 0) + " kg a " + gs(ing.bolsaGs);
      html += '<button class="list-btn" type="button" data-act="edit-ing" data-id="' + ing.id + '"><b>' + esc(ing.nombre) + "</b> " + tags + "<small>MS " + fmt(ing.ms, 0) + " % · PB " + fmt(ing.pb, 1) + " % · " + gs(precio) + "/kg" + esc(extra) + "</small></button>";
    });
    html += '<button class="btn" type="button" data-act="nuevo-ing">Nuevo insumo</button>';
    return html;
  }

  function screenIngrediente() {
    var ing = byId(S.db.ingredientes, S.editId);

    var tc = S.db.settings.tipoCambio;
    var precio = root.TGRation.precioKg(ing, tc);
    var html = '<button class="btn-ghost no-print" type="button" data-go="insumos">Volver a insumos</button>';

    html += '<div class="card">';
    html += '<label class="f"><span>Nombre</span><input data-bind="ing-nombre" value="' + esc(ing.nombre) + '"></label>';
    html += '<div class="grid-2">';
    html += '<label class="f"><span>Precio, Gs por kg tal cual</span><input inputmode="decimal" data-bind="ing-precio" value="' + esc(String(Math.round(precio))) + '"></label>';
    html += '<label class="f"><span>USD por tonelada</span><input inputmode="decimal" data-bind="ing-usd" value="' + esc(ing.precioUsdTon || "") + '"></label>';
    html += "</div>";
    html += '<div class="grid-2">';
    html += '<label class="f"><span>Precio de la bolsa, Gs</span><input inputmode="decimal" data-bind="ing-bolsa" value="' + esc(ing.bolsaGs || "") + '"></label>';
    html += '<label class="f"><span>Kg de la bolsa</span><input inputmode="decimal" data-bind="ing-bolsakg" value="' + esc(ing.bolsaKg || "") + '"></label>';
    html += "</div>";
    html += "<p class=\"sub\">Vigente: <b>" + gs(precio) + "/kg</b> · " + usd(root.TGRation.usdTon(precio, tc)) + "/t. Si cargás bolsa y kilos, el precio por kg sale de ahí.</p>";
    html += '<label class="f"><span>Nota de precio</span><input data-bind="ing-precionota" value="' + esc(ing.precioNota || "") + '"></label>';
    html += '<div class="grid-2">';
    ["ms", "pb", "ndt", "fdn", "ee", "ca", "p", "almidon"].forEach(function (k) {
      var labels = { ms: "MS %", pb: "PB %", ndt: "NDT %", fdn: "FDN %", ee: "EE %", ca: "Ca %", p: "P %", almidon: "Almidón %" };
      html += '<label class="f"><span>' + labels[k] + '</span><input inputmode="decimal" data-bind="ing-nut" data-nut="' + k + '" value="' + esc(String(ing[k])) + '"></label>';
    });
    html += "</div>";

  function onClick(e) {
    var t = e.target.closest("[data-go],[data-act]");
    if (!t) return;
    if (t.getAttribute("data-go")) {
      S.screen = t.getAttribute("data-go");
      S.lpMsg = "";
      save();
      render();
      window.scrollTo(0, 0);
      return;
    }
    var act = t.getAttribute("data-act");
    var f = activa();
    if (act === "step") {
      var it = itemDe(f, t.getAttribute("data-id"));
      var dir = Number(t.getAttribute("data-dir"));
      it.pct = Math.max(0, Math.round((Number(it.pct) + dir * 0.5) * 10) / 10);
      it.usar = it.pct > 0;
      save();
      render();
    } else if (act === "especie") {
      var esp = t.getAttribute("data-val");
      var actual = catDe(f);
      if (actual && actual.especie === esp) return;
      var primero = categoriasVisibles().filter(function (c) { return c.especie === esp; })[0];
      if (primero) {
        f.categoriaId = primero.id;
        pedirSacarInsumos(f);
      }
      save();
      render();
    } else if (act === "modo" || act === "imsModo") {
      f[act === "modo" ? "modo" : "imsModo"] = t.getAttribute("data-val");
      save();
      render();
    } else if (act === "cerrar100") {
      root.TGRation.cerrarEn100(f);
      save();
      toast("Los porcentajes quedaron en 100.");
    } else if (act === "cargar-categoria") {
      var c = catDe(f);
      if (!c) return;
      f.pv = c.pv;
      f.gmd = c.gmd;
      f.imsPct = c.req.imsPct;
      f.imsModo = c.imsModo || "pct";
      f.imsKg = c.imsModo === "kg" ? c.imsKg : Math.round(c.pv * c.req.imsPct) / 100;
      save();
      render();
    } else if (act === "sugerir") {
      root.TGRation.sugerirLimites(f, S.db);
      save();
      toast("Límites sugeridos cargados.");
    } else if (act === "optimizar") {
      var r = root.TGRation.optimizar(f, S.db);
      S.lpMsg = r.texto;
      S.lpOk = !!r.ok;
      save();
      if (r.ok) {
        S.screen = "resultado";
        toast("Mezcla de mínimo costo lista.");
      } else render();
    } else if (act === "borrar-formula") {
      S.confirm = {
        titulo: "Quitar esta fórmula",
        texto: "Se borra de este aparato. Si ya exportaste un respaldo, ese archivo queda igual.",
        si: "Quitar",
        run: function () {
          S.db.formulas = S.db.formulas.filter(function (x) { return x.id !== f.id; });
          if (!S.db.formulas.length) nuevaFormula();
          else {
            S.db.activeFormulaId = S.db.formulas[0].id;
            S.screen = "formulas";
          }
        },
      };
      render();
    } else if (act === "duplicar") {
      var copia = JSON.parse(JSON.stringify(f));
      copia.id = "f" + Date.now().toString(36);
      copia.nombre = f.nombre + " (copia)";
      copia.fecha = hoy();
      S.db.formulas.unshift(copia);
      S.db.activeFormulaId = copia.id;
      save();
      toast("Copia lista para editar.");
    } else if (act === "nueva") {
      nuevaFormula();
      save();
      S.screen = "formular";
      render();
    } else if (act === "abrir") {
      S.db.activeFormulaId = t.getAttribute("data-id");
      S.screen = "formular";
      save();
      render();
      window.scrollTo(0, 0);
    } else if (act === "edit-ing") {
      S.editId = t.getAttribute("data-id");
      S.screen = "ingrediente";
      render();
    } else if (act === "nuevo-ing") {
      var id = "ing" + Date.now().toString(36);
      S.db.ingredientes.push({
        id: id, nombre: "Nuevo insumo", grupo: "Concentrados", ms: 88, pb: 0, ndt: 0, fdn: 0, ee: 0, ca: 0, p: 0, almidon: 0,
        ureaPct: 0, contieneUrea: false, contieneMonensina: false, monensinaMgKg: 0, forraje: false, uso: "general",
        estimado: true, retrocalculado: false, ancla: "kg", precioGsKg: 0, bolsaGs: null, bolsaKg: null, precioUsdTon: null,
        precioEstimado: true, precioNota: "", fuente: "Cargado por el usuario.", nota: "", orden: 30, activo: true,
      });
      S.editId = id;
      S.screen = "ingrediente";
      save();
      render();
    } else if (act === "borrar-ing") {
      S.confirm = { titulo: "Quitar insumo", texto: "Se borra de la biblioteca. Las fórmulas que lo usaban dejan de contarlo.", si: "Quitar", run: function () {
        S.db.ingredientes = S.db.ingredientes.filter(function (i) { return i.id !== S.editId; });
        S.screen = "insumos";
        save();
      }};
      render();
    } else if (act === "edit-cat") {
      S.editId = t.getAttribute("data-id");
      S.screen = "requerimiento";
      render();
    } else if (act === "edit-cli") {
      S.editId = t.getAttribute("data-id");
      S.screen = "cliente";
      render();
    } else if (act === "nuevo-cli") {
      var cid = "cli" + Date.now().toString(36);
      S.db.clientes.push({ id: cid, nombre: "Nuevo cliente", establecimiento: "", notas: "" });
      S.editId = cid;
      S.screen = "cliente";
      save();
      render();
    } else if (act === "exportar") {
      exportar();
    } else if (act === "reset") {
      S.confirm = { titulo: "Volver a los datos de fábrica", texto: "Se pierden los cambios de este aparato. Si hace falta, exportá antes el JSON.", si: "Restablecer", run: function () {
        S.db = root.TGData.crearBase();
        S.screen = "formular";
        save();
      }};
      render();
    } else if (act === "confirm-yes") {
      var run = S.confirm && S.confirm.run;
      S.confirm = null;
      if (run) run();
      save();
      render();
    } else if (act === "confirm-acc") {
      var idx = Number(t.getAttribute("data-i"));
      var acc = S.confirm && S.confirm.acciones && S.confirm.acciones[idx];
      S.confirm = null;
      if (acc && acc.run) acc.run();
      save();
      render();
    } else if (act === "confirm-no") {
      var cancelar = S.confirm && S.confirm.cancelar;
      S.confirm = null;
      if (cancelar) cancelar();
      render();
    } else if (act === "imprimir") {
      window.print();
    }
  }

  function onChange(e) {
    aplicar(e.target);
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) {
      importar(e.target.files[0]);
      return;
    }
    if (e.target.getAttribute("data-act") === "agregar") {
      var id = e.target.value;
      if (!id) return;
      var f = activa();
      var it = itemDe(f, id);
      it.usar = true;
      if (!(it.pct > 0)) it.pct = 0;
      save();
      render();
      return;
    }
    save();
    if (e.target.tagName === "SELECT" || S.screen === "ingrediente" || S.screen === "ajustes" || S.screen === "requerimiento" || S.screen === "informe") render();
  }
  function onInput(e) {
    aplicar(e.target);
    save();
    if (S.screen === "formular") pintarVivo();
  }

  function aplicar(el) {
    if (!el || !el.getAttribute) return;
    var bind = el.getAttribute("data-bind");
    if (!bind) return;
    var f = activa();
    var v = el.type === "checkbox" ? el.checked : el.value;
    if (bind === "nombre" || bind === "fecha" || bind === "notasInternas" || bind === "observaciones") f[bind] = v;
    else if (["pv", "gmd", "cabezas", "imsPct", "imsKg", "imsGPorKg", "tratos", "cargaKg", "aguaL"].indexOf(bind) >= 0) {
      var n = parseNum(v);
      if (n != null) f[bind] = n;
    } else if (bind === "clienteId") {
      if (v === f.clienteId) return;
      if (sumaCargada(f) === 0 && (!f.nombre || f.nombre === "Nueva ración")) {
        aplicarClienteVacio(f, v);
        return;
      }
      pedirCambioCliente(f, v);
    } else if (bind === "categoriaId") {
      if (v === f.categoriaId) return;
      f.categoriaId = v;
      pedirSacarInsumos(f);
    }
    else if (bind === "pct" || bind === "min" || bind === "max") {
      var it = itemDe(f, el.getAttribute("data-id"));
      var n2 = parseNum(v);
      if (n2 != null) {
        it[bind] = Math.max(0, n2);
        if (bind === "pct") it.usar = it.pct > 0;
      }
    } else if (bind === "usar") {
      itemDe(f, el.getAttribute("data-id")).usar = el.checked;
    } else if (bind === "lim-min" || bind === "lim-max") {
      var key = el.getAttribute("data-nut");
      f.limites = f.limites || {};
      f.limites[key] = f.limites[key] || { min: null, max: null };
      var lado = bind === "lim-min" ? "min" : "max";
      if (String(v).trim() === "") f.limites[key][lado] = null;
      else {
        var n3 = parseNum(v);
        if (n3 != null) f.limites[key][lado] = n3;
      }
    } else if (bind === "tc") {
      var n4 = parseNum(v);
      if (n4 != null && n4 > 0) S.db.settings.tipoCambio = n4;
    } else if (bind === "lecheria") S.db.settings.lecheria = el.checked;
    else if (bind === "mostrarCostos") S.db.settings.mostrarCostos = !!el.checked;
    else if (bind.indexOf("ing-") === 0) aplicarIng(el, bind, v);
    else if (bind.indexOf("req-") === 0) aplicarReq(el, bind, v);
    else if (bind.indexOf("cli-") === 0) aplicarCli(el, bind, v);
  }

  function aplicarIng(el, bind, v) {
    var ing = byId(S.db.ingredientes, S.editId);
    if (!ing) return;
    if (bind === "ing-nombre") ing.nombre = v;
    else if (bind === "ing-nota") ing.nota = v;
    else if (bind === "ing-precionota") ing.precioNota = v;
    else if (bind === "ing-uso") ing.uso = v;
    else if (bind === "ing-flag") ing[el.getAttribute("data-nut")] = el.checked;
    else if (bind === "ing-nut") {
      var n = parseNum(v);
      if (n != null) ing[el.getAttribute("data-nut")] = n;
    } else if (bind === "ing-precio") {
      var p = parseNum(v);
      if (p != null) {
        ing.ancla = "kg";
        ing.precioGsKg = p;
        ing.precioEstimado = false;
        if (ing.bolsaKg > 0) ing.bolsaGs = Math.round(p * ing.bolsaKg);
      }
    } else if (bind === "ing-bolsa" || bind === "ing-bolsakg") {
      if (bind === "ing-bolsa") ing.bolsaGs = parseNum(v);
      else ing.bolsaKg = parseNum(v);
      if (ing.bolsaGs > 0 && ing.bolsaKg > 0) {
        ing.ancla = "bolsa";
        ing.precioGsKg = ing.bolsaGs / ing.bolsaKg;
        ing.precioEstimado = false;
      }
    } else if (bind === "ing-usd") {
      var u = parseNum(v);
      ing.precioUsdTon = u;
      if (u > 0) {
        ing.ancla = "usd";
        ing.precioGsKg = (u * S.db.settings.tipoCambio) / 1000;
        ing.precioEstimado = false;
      }
    }
  }
  function aplicarReq(el, bind, v) {
    var c = byId(S.db.categorias, S.editId);
    if (!c) return;
    var n = parseNum(v);
    if (n == null) return;
    var map = { "req-pb": "pb", "req-ndt": "ndt", "req-ca": "ca", "req-p": "p", "req-ims": "imsPct", "req-fdn": "fdnMin", "req-alm": "almMax", "req-conc": "concMax", "req-cap": "caPMin" };
    if (map[bind]) c.req[map[bind]] = n;
    if (bind === "req-pv") c.pv = n;
    if (bind === "req-gmd") c.gmd = n;
    if (bind === "req-imskg") c.imsKg = n;
  }
  function aplicarCli(el, bind, v) {
    var c = byId(S.db.clientes, S.editId);
    if (!c) return;
    if (bind === "cli-nombre") c.nombre = v;
    if (bind === "cli-est") c.establecimiento = v;
    if (bind === "cli-notas") c.notas = v;
  }

  function aplicarClienteVacio(f, clienteId) {
    f.clienteId = clienteId;
    var catId = clienteId === "maria-elena" ? "ovi-cordero" : "bov-adap";
    var catNueva = byId(S.db.categorias, catId);
    if (!catNueva) return;
    f.categoriaId = catNueva.id;
    f.pv = catNueva.pv;
    f.gmd = catNueva.gmd;
    f.imsPct = catNueva.req.imsPct;
    f.imsModo = catNueva.imsModo || "pct";
    f.imsKg = catNueva.imsModo === "kg" ? catNueva.imsKg : Math.round(catNueva.pv * catNueva.req.imsPct) / 100;
    f.limites = root.TGData.limitesDesde(catNueva);
  }
  function empezarPara(clienteId) {
    var catId = clienteId === "maria-elena" ? "ovi-cordero" : "bov-adap";
    var catNueva = byId(S.db.categorias, catId) || byId(S.db.categorias, "bov-adap");
    var id = "f" + Date.now().toString(36);
    var cli = byId(S.db.clientes, clienteId);
    S.db.formulas.unshift({
      id: id,
      clienteId: clienteId,
      nombre: "Nueva ración",
      fecha: hoy(),
      categoriaId: catNueva.id,
      pv: catNueva.pv,
      gmd: catNueva.gmd,
      cabezas: 1,
      imsModo: catNueva.imsModo || "pct",
      imsPct: catNueva.req.imsPct,
      imsKg: catNueva.imsModo === "kg" ? catNueva.imsKg : Math.round(catNueva.pv * catNueva.req.imsPct) / 100,
      modo: "manual",
      tratos: 2,
      cargaKg: 1000,
      aguaL: 0,
      items: [],
      limites: root.TGData.limitesDesde(catNueva),
      notas: "",
      referencia: null,
    });
    S.db.activeFormulaId = id;
    S.screen = "formular";
    toast("Fórmula nueva para " + (cli ? cli.nombre : "el cliente") + ".");
  }
  function pedirCambioCliente(f, nuevoId) {
    var cli = byId(S.db.clientes, nuevoId);
    var actual = byId(S.db.clientes, f.clienteId);
    var nombre = cli ? cli.nombre : "ese cliente";
    var de = actual ? actual.nombre : "otro cliente";
    var acciones = [
      { label: "Empezar una fórmula nueva", run: function () { empezarPara(nuevoId); } },
      { label: "Mover esta fórmula", run: function () { f.clienteId = nuevoId; } },
    ];
    S.db.formulas.forEach(function (g) {
      if (g.clienteId === nuevoId && g.id !== f.id) {
        acciones.push({
          label: "Abrir: " + g.nombre,
          run: function () {
            S.db.activeFormulaId = g.id;
            S.screen = "formular";
          },
        });
      }
    });
    S.confirm = {
      titulo: nombre,
      texto: "Esta fórmula es de " + de + ". Podés empezar una nueva para " + nombre + ", mover esta, o abrir una que ya esté guardada.",
      acciones: acciones,
      no: "Cancelar",
    };
  }
  function insumosFueraDe(f) {
    var cat = catDe(f);
    var mal = [];
    (f.items || []).forEach(function (it) {
      if (!(Number(it.pct) > 0)) return;
      var ing = byId(S.db.ingredientes, it.ingredientId);
      if (ing && cat && !root.TGRation.insumoOfrecido(ing, cat)) mal.push(ing);
    });
    return mal;
  }
  function pedirSacarInsumos(f) {
    var mal = insumosFueraDe(f);
    if (!mal.length) return;
    var nombres = mal.map(function (i) { return i.nombre; }).join(", ");
    var ids = {};
    mal.forEach(function (i) { ids[i.id] = true; });
    S.confirm = {
      titulo: "Estos insumos no van acá",
      texto: nombres + ". En esta categoría no se ofrecen. ¿Los saco de la fórmula?",
      si: "Sacarlos",
      no: "Dejarlos",
      run: function () {
        f.items.forEach(function (it) {
          if (ids[it.ingredientId]) {
            it.pct = 0;
            it.usar = false;
          }
        });
        toast("Los saqué. Cerrá los porcentajes en 100 si hace falta.");
      },
    };
  }
  function visibleEnMinimo(ing, f, cat) {
    if (!ing || !ing.activo || !(ing.ms > 0)) return false;
    var it = (f.items || []).filter(function (x) { return x.ingredientId === ing.id; })[0];
    if (it && it.usar && Number(it.pct) > 0) return true;
    return root.TGRation.insumoOfrecido(ing, cat);
  }
  function sumaCargada(f) {
    return (f.items || []).reduce(function (a, it) { return a + (Number(it.pct) > 0 ? Number(it.pct) : 0); }, 0);
  }
  function pintarVivo() {
    var box = document.getElementById("live");
    if (!box) return;
    var res = root.TGRation.analizar(activa(), S.db);
    var bs = box.querySelectorAll("b");
    if (bs.length >= 4) {
      bs[0].textContent = fmt(res.sumPct, 1) + " %";
      bs[1].textContent = fmt(res.nut.pb, 1) + " %";
      bs[2].textContent = fmt(res.nut.ndt, 1) + " %";
      bs[3].textContent = fmt(res.kgMo, 2) + " kg";
    }
  }

  function nuevaFormula() {
    var id = "f" + Date.now().toString(36);
    var cat = byId(S.db.categorias, "bov-adap");
    S.db.formulas.unshift({
      id: id,
      clienteId: S.db.clientes[0].id,
      nombre: "Nueva ración",
      fecha: hoy(),
      categoriaId: "bov-adap",
      pv: cat.pv,
      gmd: cat.gmd,
      cabezas: 1,
      imsModo: "pct",
      imsPct: cat.req.imsPct,
      imsKg: Math.round(cat.pv * cat.req.imsPct) / 100,
      modo: "manual",
      tratos: 2,
      cargaKg: 1000,
      aguaL: 0,
      items: [],
      limites: root.TGData.limitesDesde(cat),
      notas: "",
      referencia: null,
    });
    S.db.activeFormulaId = id;
  }
  function hoy() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function exportar() {
    var blob = new Blob([JSON.stringify(S.db, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "tg-formulacion-respaldo.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("Respaldo listo para guardar o compartir.");
  }
  function importar(file) {
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var db = JSON.parse(reader.result);
        if (!db.ingredientes || !db.formulas) throw new Error("formato");
        db.version = 5;
        S.db = db;
        if (!byId(S.db.formulas, S.db.activeFormulaId) && S.db.formulas[0]) S.db.activeFormulaId = S.db.formulas[0].id;
        save();
        S.screen = "formulas";
        toast("Respaldo importado.");
      } catch (err) {
        toast("Ese archivo no es un respaldo de las raciones.");
        render();
      }
    };
    reader.readAsText(file);
  }

  root.TGUI = { boot: boot, informeHTML: informeHTML };
  if (typeof document !== "undefined") {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
    else boot();
  }
})(typeof globalThis !== "undefined" ? globalThis : this);

</script>

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function () {});
}
</script>
</body>
